[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "script-kitty-agent-runtime"
version = "0.1.0"
description = "PREVC Agent Execution Runtime and Subagent Manager for Script Kitty"
authors = [{ name = "Script Kitty Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "requests>=2.31.0",
    "typing-extensions>=4.0"
]
