[package]
name = "script-kitty-audit"
version = "0.1.0"
edition = "2021"
authors = ["Script Kitty Team"]
description = "Cryptographically verified, tamper-evident hash-chained audit logger"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
